<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quebra-cabeça do Brasil</title>
<meta name="description" content="Arraste os 27 estados do Brasil até o lugar certo no mapa. Dá para jogar por região, com ou sem as divisas e os nomes.">
<meta name="theme-color" content="#0f2a3d">
<style>
  :root {
    --fundo: #0f2a3d; --fundo2: #174a63; --painel: rgba(255,255,255,.08); --borda: rgba(255,255,255,.16);
    --texto: #f4f9ff; --suave: #a9c4d6; --sol: #ffd24a; --menta: #46e0a0; --coral: #ff7a6b;
    --norte: #3fbf6f; --nordeste: #ff9f43; --centro: #f7d046; --sudeste: #4aa3ff; --sul: #b07cff;
  }
  * { box-sizing: border-box; }
  html { background: var(--fundo); }
  body {
    margin: 0; min-height: 100vh; color: var(--texto);
    background: radial-gradient(circle at 50% -20%, var(--fundo2), var(--fundo) 60%) no-repeat, var(--fundo);
    font: 16px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
    display: flex; flex-direction: column;
  }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 18px; padding: 12px 16px 8px; }
  h1 { margin: 0; font-size: clamp(1.3rem, 2.6vw, 2rem); font-weight: 900; }
  h1 span { color: var(--sol); }
  .placar { display: flex; flex-wrap: wrap; gap: 8px 18px; font-weight: 700; color: var(--suave); }
  .placar b { color: var(--texto); font-variant-numeric: tabular-nums; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 0 16px 8px; }
  button, select { font: inherit; font-weight: 700; border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer; background: rgba(255,255,255,.12); color: var(--texto); }
  select { padding-right: 10px; }
  select option { color: #111; }
  button:focus-visible, select:focus-visible { outline: 3px solid var(--sol); outline-offset: 2px; }
  button.principal { background: var(--sol); color: #2a2100; }
  button[aria-pressed="true"] { background: rgba(70,224,160,.25); box-shadow: inset 0 0 0 2px var(--menta); }
  .aviso { min-height: 1.5em; padding: 0 16px; font-weight: 700; color: var(--sol); }
  body { height: 100vh; height: 100dvh; }
  .area { flex: 1 1 auto; min-height: 320px; position: relative; }
  svg#jogo { position: absolute; inset: 0 8px 4px; width: calc(100% - 16px); height: calc(100% - 4px); display: block; touch-action: none; user-select: none; -webkit-user-select: none; }

  .contorno { fill: rgba(255,255,255,.06); stroke: rgba(255,255,255,.55); stroke-width: 2.5; }
  .vaga { fill: rgba(255,255,255,.04); stroke: rgba(255,255,255,.35); stroke-width: 1.2; stroke-dasharray: 4 3; }
  .sem-divisas .vaga { stroke: none; }
  .vaga.dica { fill: rgba(255,210,74,.45); stroke: var(--sol); stroke-width: 3; stroke-dasharray: none; animation: piscar .5s ease-in-out 4 alternate; }
  @keyframes piscar { from { fill-opacity: .2; } to { fill-opacity: 1; } }

  .peca { cursor: grab; }
  .peca path.forma { stroke: #10202c; stroke-width: 1.4; filter: drop-shadow(0 4px 5px rgba(0,0,0,.45)); }
  .peca path.alca { fill: none; stroke: transparent; stroke-width: 26; }
  .peca.arrastando { cursor: grabbing; }
  .peca.arrastando path.forma { filter: drop-shadow(0 10px 12px rgba(0,0,0,.55)); stroke: #fff; stroke-width: 2.5; }
  .peca.encaixada { cursor: default; pointer-events: none; }
  .peca.encaixada path.forma { filter: none; stroke: rgba(16,32,44,.8); stroke-width: 1; }
  .peca.encaixada.brilho path.forma { animation: brilho .9s ease-out; }
  @keyframes brilho { from { fill: #fff; } }
  .peca.errou path.forma { animation: tremer .35s; }
  @keyframes tremer { 25% { translate: -8px 0; } 75% { translate: 8px 0; } }
  .sigla { font-weight: 900; font-size: 15px; fill: #10202c; pointer-events: none; text-anchor: middle; dominant-baseline: central; }
  .sem-nomes .peca:not(.encaixada) .sigla { display: none; }
  .Norte { fill: var(--norte); } .Nordeste { fill: var(--nordeste); } .Centro-Oeste { fill: var(--centro); } .Sudeste { fill: var(--sudeste); } .Sul { fill: var(--sul); }
  .mesma-cor .peca:not(.encaixada) path.forma { fill: #d8e4ec; }

  .legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 0 16px 10px; color: var(--suave); font-size: .9rem; font-weight: 600; }
  .legenda span::before { content: ""; display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; background: var(--c); }
  .mesma-cor + .legenda, body.mesma-cor .legenda { visibility: hidden; }

  .fim { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(8,22,33,.82); z-index: 10; padding: 20px; text-align: center; }
  .fim[hidden] { display: none; }
  .fim .caixa { background: var(--fundo2); border: 1px solid var(--borda); border-radius: 22px; padding: 28px 32px; max-width: 520px; }
  .fim .emoji { font-size: 4rem; line-height: 1; }
  .fim h2 { margin: 10px 0 6px; font-size: 2rem; }
  .fim p { color: var(--suave); font-size: 1.1rem; margin: 0 0 18px; }
  .fim .acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
  .rodape { text-align: center; color: var(--suave); font-size: .8rem; padding: 0 0 8px; }
  .rodape a { color: var(--suave); }
  @media (prefers-reduced-motion: reduce) { .vaga.dica, .peca.encaixada.brilho path.forma, .peca.errou path.forma { animation: none; } }
</style>
</head>

</div>

  let layout = null;
  function calcularLayout() {

  // ponto dentro do estado para escrever a sigla (centro da caixa, ajustado se cair fora)

    const ajustes = { RN: [10, 4], PE: [40, 0], AL: [0, 2], SE: [0, 2], PB: [10, 0], RJ: [0, 0], ES: [0, 0], DF: [0, 0], SC: [10, 0], MA: [-10, 10], TO: [0, 0] };

  let avisoTimer = null;
  function avisar(txt) { $("aviso").textContent = txt; clearTimeout(avisoTimer); avisoTimer = setTimeout(() => { $("aviso").textContent = ""; }, 4000); }

  // ---------- arrastar ----------
  let arrasto = null;
  function pontoSVG(e) {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(svg.getScreenCTM().inverse());
  }
  function pegar(e, sigla) {
    const pc = pecas[sigla];
    if (!jogando || pc.encaixada) return;
    e.preventDefault();
    const p = pontoSVG(e);
    arrasto = { sigla, ox: p.x - pc.dx, oy: p.y - pc.dy, id: e.pointerId };
    pc.g.classList.add("arrastando"); pc.g.classList.remove("errou");
    camadaPecas.appendChild(pc.g);                  // fica por cima das outras
    try { svg.setPointerCapture(e.pointerId); } catch (err) {}
    if (opcoes.nomes) $("aviso").textContent = ESTADOS[sigla][0];
  }
  svg.addEventListener("pointermove", (e) => {
    if (!arrasto || e.pointerId !== arrasto.id) return;
    const p = pontoSVG(e), pc = pecas[arrasto.sigla];
    pc.dx = p.x - arrasto.ox; pc.dy = p.y - arrasto.oy;
    posicionar(arrasto.sigla);
  });
  function soltar(e) {
    if (!arrasto || (e && e.pointerId !== arrasto.id)) return;
    const s = arrasto.sigla, pc = pecas[s]; arrasto = null;
    pc.g.classList.remove("arrastando");
    if (Math.hypot(pc.dx, pc.dy) <= TOLERANCIA) encaixar(s);
    else if (pertoDoMapa(pc)) { erros++; $("erros").textContent = erros; pc.g.classList.add("errou"); tom(200, .18, "sawtooth", .08); }
  }
  svg.addEventListener("pointerup", soltar);
  svg.addEventListener("pointercancel", soltar);

  // conta erro só quando a peça foi largada em cima do mapa (e não apenas arrumada ao lado)
  function pertoDoMapa(pc) {
    const cx = pc.bb.x + pc.bb.width / 2 + pc.dx, cy = pc.bb.y + pc.bb.height / 2 + pc.dy;
    return cx > 0 && cx < MW && cy > 0 && cy < MH;
  }

  function encaixar(s) {
    const pc = pecas[s];
    pc.dx = 0; pc.dy = 0; posicionar(s);
    pc.encaixada = true;
    pc.g.classList.add("encaixada", "brilho");
    camadaPecas.insertBefore(pc.g, camadaPecas.firstChild); // encaixadas ficam por baixo das soltas
    const [nome, capital] = ESTADOS[s];
    avisar(`${nome} ✔ · capital: ${capital}`);
    tom(660, .1); setTimeout(() => tom(990, .14), 90);
    if (atualizarContagem() === ativas.length) terminar();
  }

  function terminar() {
    jogando = false; clearInterval(relogio);
    const tempo = $("tempo").textContent;
    $("fim-titulo").textContent = opcoes.regiao === "todas" ? "Mapa completo!" : `Região ${opcoes.regiao} completa!`;
    $("fim-texto").textContent = `${ativas.length} peças em ${tempo}, com ${erros} erro${erros === 1 ? "" : "s"}.`;
    [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => tom(f, .3), i * 150));
    setTimeout(() => { $("fim").hidden = false; $("de-novo").focus(); }, 700);
  }

  // ---------- dica: pisca o lugar de uma peça que falta ----------
  $("dica").addEventListener("click", () => {
    if (!jogando) return;
    const falta = ativas.filter((s) => !pecas[s].encaixada);
    if (!falta.length) return;
    const s = falta[Math.floor(Math.random() * falta.length)];
    const v = vagas[s];
    v.classList.remove("dica"); void v.getBBox(); v.classList.add("dica");
    setTimeout(() => v.classList.remove("dica"), 2200);
    avisar(`Dica: o lugar de ${ESTADOS[s][0]} está piscando.`);
  });

  // ---------- opções ----------
  function aplicarOpcoes() {
    document.body.classList.toggle("sem-divisas", !opcoes.divisas);
    document.body.classList.toggle("sem-nomes", !opcoes.nomes);
    document.body.classList.toggle("mesma-cor", !opcoes.cores);
    $("opt-divisas").setAttribute("aria-pressed", String(opcoes.divisas));
    $("opt-nomes").setAttribute("aria-pressed", String(opcoes.nomes));
    $("opt-cores").setAttribute("aria-pressed", String(opcoes.cores));
    $("regiao").value = opcoes.regiao;
  }
  [["opt-divisas", "divisas"], ["opt-nomes", "nomes"], ["opt-cores", "cores"]].forEach(([id, k]) => {
    $(id).addEventListener("click", () => { opcoes[k] = !opcoes[k]; guardar(k, opcoes[k]); aplicarOpcoes(); });
  });
  $("regiao").addEventListener("change", () => {
    opcoes.regiao = $("regiao").value; guardar("regiao", opcoes.regiao);
    if (jogando || $("comecar").textContent === "Recomeçar") comecar();
  });
  $("comecar").addEventListener("click", comecar);
  $("de-novo").addEventListener("click", comecar);
  $("fechar-fim").addEventListener("click", () => { $("fim").hidden = true; });

  // Antes de começar, mostra o mapa montado.
  montar(); aplicarOpcoes();
  for (const s in pecas) { pecas[s].encaixada = true; pecas[s].g.classList.add("encaixada"); }
  ativas = Object.keys(pecas).filter(emJogo); $("contagem").textContent = `0/${ativas.length}`;

  // Se a tela mudar de formato (girar o celular), remonta mantendo as peças já encaixadas.
  let ultimoFormato = null;
  window.addEventListener("resize", () => {
    const r = svg.getBoundingClientRect(), largo = r.width / Math.max(1, r.height) > 1.05;
    if (ultimoFormato === null) ultimoFormato = layout.largo;
    if (largo === ultimoFormato || !jogando) return;
    ultimoFormato = largo;
    const feitas = new Set(ativas.filter((s) => pecas[s].encaixada));
    montar(); aplicarOpcoes(); espalhar();
    feitas.forEach((s) => { const pc = pecas[s]; pc.dx = 0; pc.dy = 0; pc.encaixada = true; pc.g.classList.add("encaixada"); posicionar(s); camadaPecas.insertBefore(pc.g, camadaPecas.firstChild); });
    atualizarContagem();
  });
})();
</script>
</body>
</html>
